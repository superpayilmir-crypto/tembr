name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Собрать APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Переименовать
        run: cp app/build/outputs/apk/release/app-release.apk Tembr.apk

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Тембр 1.0.${{ github.run_number }}
          body: |
            Установка на Android: скачайте **Tembr.apk** на телефон, откройте файл и разрешите установку из этого источника.
          files: Tembr.apk
          make_latest: true
